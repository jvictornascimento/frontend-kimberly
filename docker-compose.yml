services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8081/api}
    container_name: belyeve-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - belyeve-public
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: belyeve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - belyeve-postgres-data:/var/lib/postgresql/data
    networks:
      - belyeve-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: belyeve-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      SCOOP_ONE_PRICE_CENTS: ${SCOOP_ONE_PRICE_CENTS:?Set SCOOP_ONE_PRICE_CENTS}
      SCOOP_TWO_PRICE_CENTS: ${SCOOP_TWO_PRICE_CENTS:?Set SCOOP_TWO_PRICE_CENTS}
      SCOOP_THREE_PRICE_CENTS: ${SCOOP_THREE_PRICE_CENTS:?Set SCOOP_THREE_PRICE_CENTS}
      NON_LOCAL_SHIPPING_CENTS: ${NON_LOCAL_SHIPPING_CENTS:?Set NON_LOCAL_SHIPPING_CENTS}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:?Set ASAAS_BASE_URL}
      ASAAS_API_KEY: ${ASAAS_API_KEY:?Set ASAAS_API_KEY}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?Set ASAAS_WEBHOOK_TOKEN}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    networks:
      - belyeve-public
      - belyeve-db
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  belyeve-postgres-data:

networks:
  belyeve-public:
  belyeve-db:
    internal: true
