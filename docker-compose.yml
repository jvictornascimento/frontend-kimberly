services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8081/api}
    container_name: belyeve-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - belyeve-public
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: belyeve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - belyeve-postgres-data:/var/lib/postgresql/data
    networks:
      - belyeve-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: belyeve-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-}
      TURNSTILE_TIMEOUT_SECONDS: ${TURNSTILE_TIMEOUT_SECONDS:-5}
      CHECKOUT_TRUSTED_PROXY_CIDRS: ${CHECKOUT_TRUSTED_PROXY_CIDRS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      SCOOP_ONE_PRICE_CENTS: ${SCOOP_ONE_PRICE_CENTS:?Set SCOOP_ONE_PRICE_CENTS}
      SCOOP_TWO_PRICE_CENTS: ${SCOOP_TWO_PRICE_CENTS:?Set SCOOP_TWO_PRICE_CENTS}
      SCOOP_THREE_PRICE_CENTS: ${SCOOP_THREE_PRICE_CENTS:?Set SCOOP_THREE_PRICE_CENTS}
      MELHOR_ENVIO_OAUTH_ENABLED: ${MELHOR_ENVIO_OAUTH_ENABLED:-false}
      MELHOR_ENVIO_SANDBOX_CLIENT_ID: ${MELHOR_ENVIO_SANDBOX_CLIENT_ID:-}
      MELHOR_ENVIO_SANDBOX_CLIENT_SECRET: ${MELHOR_ENVIO_SANDBOX_CLIENT_SECRET:-}
      MELHOR_ENVIO_PRODUCTION_CLIENT_ID: ${MELHOR_ENVIO_PRODUCTION_CLIENT_ID:-}
      MELHOR_ENVIO_PRODUCTION_CLIENT_SECRET: ${MELHOR_ENVIO_PRODUCTION_CLIENT_SECRET:-}
      MELHOR_ENVIO_REDIRECT_URI: ${MELHOR_ENVIO_REDIRECT_URI:-https://www.belyeve.com.br/api/integrations/melhor-envio/callback}
      MELHOR_ENVIO_SETUP_KEY: ${MELHOR_ENVIO_SETUP_KEY:-}
      MELHOR_ENVIO_TOKEN_ENCRYPTION_KEY: ${MELHOR_ENVIO_TOKEN_ENCRYPTION_KEY:-}
      MELHOR_ENVIO_ENABLED: ${MELHOR_ENVIO_ENABLED:-false}
      MELHOR_ENVIO_ENVIRONMENT: ${MELHOR_ENVIO_ENVIRONMENT:-sandbox}
      MELHOR_ENVIO_SANDBOX_TOKEN: ${MELHOR_ENVIO_SANDBOX_TOKEN:-}
      MELHOR_ENVIO_PRODUCTION_TOKEN: ${MELHOR_ENVIO_PRODUCTION_TOKEN:-}
      MELHOR_ENVIO_USER_AGENT: ${MELHOR_ENVIO_USER_AGENT:-}
      MELHOR_ENVIO_ORIGIN_ZIP_CODE: ${MELHOR_ENVIO_ORIGIN_ZIP_CODE:-}
      MELHOR_ENVIO_SERVICES: ${MELHOR_ENVIO_SERVICES:-1,2}
      SHIPPING_QUOTE_TTL_SECONDS: ${SHIPPING_QUOTE_TTL_SECONDS:-900}
      SHIPPING_TIMEOUT_SECONDS: ${SHIPPING_TIMEOUT_SECONDS:-10}
      SCOOP_1_PARCEL_WIDTH: ${SCOOP_1_PARCEL_WIDTH:-0}
      SCOOP_1_PARCEL_HEIGHT: ${SCOOP_1_PARCEL_HEIGHT:-0}
      SCOOP_1_PARCEL_LENGTH: ${SCOOP_1_PARCEL_LENGTH:-0}
      SCOOP_1_PARCEL_WEIGHT: ${SCOOP_1_PARCEL_WEIGHT:-0}
      SCOOP_2_PARCEL_WIDTH: ${SCOOP_2_PARCEL_WIDTH:-0}
      SCOOP_2_PARCEL_HEIGHT: ${SCOOP_2_PARCEL_HEIGHT:-0}
      SCOOP_2_PARCEL_LENGTH: ${SCOOP_2_PARCEL_LENGTH:-0}
      SCOOP_2_PARCEL_WEIGHT: ${SCOOP_2_PARCEL_WEIGHT:-0}
      SCOOP_3_PARCEL_WIDTH: ${SCOOP_3_PARCEL_WIDTH:-0}
      SCOOP_3_PARCEL_HEIGHT: ${SCOOP_3_PARCEL_HEIGHT:-0}
      SCOOP_3_PARCEL_LENGTH: ${SCOOP_3_PARCEL_LENGTH:-0}
      SCOOP_3_PARCEL_WEIGHT: ${SCOOP_3_PARCEL_WEIGHT:-0}
      ASAAS_ENVIRONMENT: ${ASAAS_ENVIRONMENT:-sandbox}
      ASAAS_SANDBOX_BASE_URL: ${ASAAS_SANDBOX_BASE_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_PRODUCTION_BASE_URL: ${ASAAS_PRODUCTION_BASE_URL:-https://api.asaas.com/v3}
      ASAAS_SANDBOX_API_KEY: ${ASAAS_SANDBOX_API_KEY:?Set ASAAS_SANDBOX_API_KEY}
      ASAAS_PRODUCTION_API_KEY: ${ASAAS_PRODUCTION_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?Set ASAAS_WEBHOOK_TOKEN}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-false}
      PURCHASE_EMAIL_ENABLED: ${PURCHASE_EMAIL_ENABLED:-false}
      PURCHASE_EMAIL_FROM: ${PURCHASE_EMAIL_FROM:-}
      PURCHASE_EMAIL_TO: ${PURCHASE_EMAIL_TO:-}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      PURCHASE_CUSTOMER_EMAIL_ENABLED: ${PURCHASE_CUSTOMER_EMAIL_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    networks:
      - belyeve-public
      - belyeve-db
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  belyeve-postgres-data:

networks:
  belyeve-public:
  belyeve-db:
    internal: true
