server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: belyeve-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/belyeve}
    username: ${SPRING_DATASOURCE_USERNAME:belyeve}
    password: ${SPRING_DATASOURCE_PASSWORD:belyeve}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
  pricing:
    scoop-one-price-cents: ${SCOOP_ONE_PRICE_CENTS}
    scoop-two-price-cents: ${SCOOP_TWO_PRICE_CENTS}
    scoop-three-price-cents: ${SCOOP_THREE_PRICE_CENTS}
  asaas:
    environment: ${ASAAS_ENVIRONMENT:sandbox}
    sandbox-base-url: ${ASAAS_SANDBOX_BASE_URL:https://api-sandbox.asaas.com/v3}
    production-base-url: ${ASAAS_PRODUCTION_BASE_URL:https://api.asaas.com/v3}
    sandbox-api-key: ${ASAAS_SANDBOX_API_KEY:}
    production-api-key: ${ASAAS_PRODUCTION_API_KEY:}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN}
  purchase-email:
    enabled: ${PURCHASE_EMAIL_ENABLED:false}
    from: ${PURCHASE_EMAIL_FROM:}
    to: ${PURCHASE_EMAIL_TO:}
    customer-enabled: ${PURCHASE_CUSTOMER_EMAIL_ENABLED:false}
  shipping:
    enabled: ${MELHOR_ENVIO_ENABLED:false}
    environment: ${MELHOR_ENVIO_ENVIRONMENT:sandbox}
    sandbox-token: ${MELHOR_ENVIO_SANDBOX_TOKEN:}
    production-token: ${MELHOR_ENVIO_PRODUCTION_TOKEN:}
    user-agent: ${MELHOR_ENVIO_USER_AGENT:}
    origin-zip-code: ${MELHOR_ENVIO_ORIGIN_ZIP_CODE:}
    services: ${MELHOR_ENVIO_SERVICES:1,2}
    quote-ttl-seconds: ${SHIPPING_QUOTE_TTL_SECONDS:900}
    timeout-seconds: ${SHIPPING_TIMEOUT_SECONDS:10}
    parcels:
      1:
        width: ${SCOOP_1_PARCEL_WIDTH:0}
        height: ${SCOOP_1_PARCEL_HEIGHT:0}
        length: ${SCOOP_1_PARCEL_LENGTH:0}
        weight: ${SCOOP_1_PARCEL_WEIGHT:0}
      2:
        width: ${SCOOP_2_PARCEL_WIDTH:0}
        height: ${SCOOP_2_PARCEL_HEIGHT:0}
        length: ${SCOOP_2_PARCEL_LENGTH:0}
        weight: ${SCOOP_2_PARCEL_WEIGHT:0}
      3:
        width: ${SCOOP_3_PARCEL_WIDTH:0}
        height: ${SCOOP_3_PARCEL_HEIGHT:0}
        length: ${SCOOP_3_PARCEL_LENGTH:0}
        weight: ${SCOOP_3_PARCEL_WEIGHT:0}
